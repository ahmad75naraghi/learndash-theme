name: Build theme release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish deployable theme ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer

      - name: Resolve PHP 7.4-compatible mPDF dependencies
        run: composer update --no-dev --classmap-authoritative --no-interaction --prefer-dist --no-progress

      - name: Verify Persian certificate generation
        run: php tests/certificate-font-test.php

      - name: Build deployable package with vendor
        run: bash bin/build-theme-release.sh /tmp/evented-edu.zip

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^Version:[[:space:]]*([^[:space:]]+).*/\1/p' style.css | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" /tmp/evented-edu.zip \
            --target "$GITHUB_SHA" \
            --title "evented-edu $VERSION" \
            --notes "نسخهٔ نصب‌شدنی کامل قالب شامل mPDF، وابستگی‌های Composer و فونت‌های TTF فارسی گواهینامه."
