name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: PHP / JS / CSS syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run lint script
        run: bash bin/lint.sh

      - name: Test updater, panel helpers and static QA
        run: |
          php tests/theme-updater-test.php
          php tests/panel-helpers-test.php
          python3 tests/static-audit.py
          bash bin/build-theme-release.sh /tmp/evented-edu.zip

  wordpress-smoke:
    name: WordPress runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bin/dev-playground.sh

      - name: Start WordPress Playground
        run: bash bin/dev-playground.sh

      - name: Test public, panel, AJAX and admin routes
        env:
          SMOKE_WRITE_PROFILE: '1'
        run: |
          set +e
          bash bin/smoke-test.sh http://127.0.0.1:9400 /tmp/wp/site/debug.log 2>&1 | tee /tmp/smoke-output.log
          status=${PIPESTATUS[0]}
          {
            echo '### WordPress smoke output'
            echo '```text'
            cat /tmp/smoke-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Test a real theme replacement
        run: bash bin/test-wordpress-update.sh http://127.0.0.1:9400 /tmp/wp/site
