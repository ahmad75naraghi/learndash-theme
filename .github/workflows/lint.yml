name: Lint

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    name: PHP / JS / CSS syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run lint script
        run: bash bin/lint.sh
